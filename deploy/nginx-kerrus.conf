# ============================================================
# KERRUS 静态站点 Nginx 配置
# 部署路径：/etc/nginx/conf.d/kerrus.conf （或 sites-available）
# 站点文件：/var/www/kerrus/
# ============================================================

server {
    listen       80;
    listen       [::]:80;

    # 替换为你的域名；暂无域名时可先用服务器公网 IP 访问
    server_name  www.kerrus.com kerrus.com _;

    root         /var/www/kerrus;
    index        index.html;

    # ---------- 日志 ----------
    access_log   /var/log/nginx/kerrus-access.log;
    error_log    /var/log/nginx/kerrus-error.log;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---------- 静态资源缓存（页面不缓存，便于更新即时生效） ----------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 路由：单页锚点站点 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# HTTPS（推荐：域名解析生效后用 certbot 自动生成证书）
#   Ubuntu/Debian:  sudo apt install -y certbot python3-certbot-nginx
#                   sudo certbot --nginx -d kerrus.com -d www.kerrus.com
# 生成后 certbot 会自动把上面的 80 端口改写为 301 跳转到 443
# ============================================================
